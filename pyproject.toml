[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceprefs"
version = "0.1.0"
description = "Print an Ice preferences file as readable JSON, including the hotkeys that plutil leaves as base64. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Younes Z." }]
keywords = [
  "ice",
  "menu bar",
  "macos",
  "preferences",
  "plist",
  "defaults",
  "dotfiles",
  "hotkeys",
  "json",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rezarys/iceprefs"
Issues = "https://github.com/Rezarys/iceprefs/issues"

[project.scripts]
iceprefs = "iceprefs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
